name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate TypeScript and Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 pkg-config libssl-dev
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: CodeFormer tests
        run: npm run test:codeformer
      - name: Rust tests
        working-directory: core
        run: cargo test

  package:
    name: Package ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run dist:linux -- --publish never
            artifact: linux
          - os: windows-latest
            command: npm run dist:win -- --publish never
            artifact: windows
          - os: macos-latest
            command: npm run dist:mac -- --publish never
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 pkg-config libssl-dev libarchive-tools xz-utils binutils
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        env:
          # Optional Authenticode signing for Windows. Keep both values in GitHub Secrets.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: ${{ matrix.command }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openshoot-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: openshoot-*
          merge-multiple: true
      - name: List release artifacts
        run: find release-artifacts -maxdepth 2 -type f -print
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
