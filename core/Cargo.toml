[package]
name = "openshoot-core"
version = "0.1.0"
edition = "2021"
description = "OpenShoot core: RAW decode, AI culling/editing pipeline (ONNX), XMP writer"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "openshoot_core"

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
