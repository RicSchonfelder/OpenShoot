[package]
name = "openshoot-core"
version = "0.1.0"
edition = "2021"
description = "OpenShoot core: RAW decode, AI culling/editing pipeline (ONNX), XMP writer"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "openshoot_core"

[dependencies]
napi = { version = "2", features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
base64 = "0.22"
walkdir = "2"
sha2 = "0.10"
kamadak-exif = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
imageproc = "0.27.0"
rayon = "1.12.0"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
