appId: com.openshoot.app
productName: OpenShoot
copyright: Copyright © 2026 OpenShoot contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - core/models/**
  - core/*.node
  - '!**/.DS_Store'

asarUnpack:
  - core/**/*.node
  - core/models/**

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.photography
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Graphics
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: OpenShoot
    Comment: AI photo culling, editing & retouching — 100% local & offline
    StartupWMClass: OpenShoot

deb:
  packageCategory: graphics
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2

dmg:
  title: ${productName}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
